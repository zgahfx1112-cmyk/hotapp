<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>JS 诊断工具</title>
  <style>
    body { font-family: monospace; padding: 20px; background: #1e1e1e; color: #d4d4d4; }
    .log { margin: 5px 0; padding: 8px; background: #2d2d2d; border-left: 3px solid #4a4a4a; white-space: pre-wrap; }
    .error { border-left-color: #f14c4c; color: #f14c4c; }
    .success { border-left-color: #4ec9b0; color: #4ec9b0; }
    .info { border-left-color: #569cd6; }
    .warn { border-left-color: #ce9178; color: #ce9178; }
    button { padding: 10px 20px; margin: 5px; background: #0e639c; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
    button:hover { background: #1177bb; }
  </style>
</head>
<body>
  <h1>🔍 JavaScript 诊断工具</h1>
  <p>逐个测试 JS 文件，定位问题</p>

  <button onclick="testAll()" style="background: #388a34;">测试全部文件</button>
  <button onclick="testInit()" style="background: #b5890b;">测试 init()</button>
  <button onclick="document.getElementById('output').innerHTML=''" style="background: #c53030;">清空输出</button>

  <div id="output"></div>

  <script>
    const output = document.getElementById('output');

    function log(msg, type = 'info') {
      const div = document.createElement('div');
      div.className = 'log ' + type;
      div.textContent = msg;
      output.appendChild(div);
    }

    // 捕获所有未处理的错误
    window.onerror = function(msg, url, line, col, error) {
      log('❌ 全局错误: ' + msg + '\n  文件: ' + url + '\n  行: ' + line, 'error');
      return true;
    };
    window.addEventListener('unhandledrejection', function(e) {
      log('❌ 未处理的 Promise 拒绝: ' + e.reason, 'error');
    });

    async function testAll() {
      log('\n🚀 开始测试所有文件...\n', 'info');

      const files = [
        '/topic-keywords.js',
        '/digest.js',
        '/achievements.js',
        '/init-controller.js',
        '/app.js'
      ];

      for (const file of files) {
        log(`========== ${file} ==========`, 'info');
        try {
          const resp = await fetch(file);
          if (!resp.ok) {
            log(`❌ HTTP ${resp.status}`, 'error');
            continue;
          }
          const code = await resp.text();
          log(`📥 下载成功 (${code.length} bytes)`, 'success');

          try {
            eval(code);
            log(`✅ 执行成功`, 'success');
          } catch(e) {
            log(`❌ 执行失败: ${e.message}`, 'error');
            if (e.stack) log(e.stack, 'error');
          }
        } catch(e) {
          log(`❌ 下载失败: ${e.message}`, 'error');
        }
      }

      // 检查关键函数
      log('\n========== 变量检查 ==========', 'info');
      const checks = ['TOPIC_KEYWORDS','selectRecommendDigestItems','getDigestLabel',
        'updateReadingStats','checkMilestones','getWeeklyReport','createInitController',
        'state','Recommender','init','renderTab','buildHybridFeed','scoreCandidate',
        'calculateMMR','openReader','shareItem','generateShareCard'];
      for (const name of checks) {
        try {
          const type = typeof eval(name);
          log(`  ✅ ${name}: ${type}`, 'success');
        } catch(e) {
          log(`  ❌ ${name}: undefined`, 'error');
        }
      }

      // 测试调用 init
      log('\n========== 测试 init() ==========', 'info');
      try {
        await init();
        log('✅ init() 完成', 'success');
        log(`state.currentTab: ${state.currentTab}`, 'info');
        log(`state.articles.length: ${state.articles.length}`, 'info');
        log(`state.hotItems.length: ${state.hotItems.length}`, 'info');
        log(`state.sources.length: ${state.sources.length}`, 'info');
        log(`骨架屏移除: ${!document.getElementById('skeletonLoader')}`, 'info');
      } catch(e) {
        log(`❌ init() 失败: ${e.message}`, 'error');
        if (e.stack) log(e.stack, 'error');
      }

      log('\n✅ 诊断完成', 'success');
    }

    async function testInit() {
      log('\n🧪 直接测试 init()...\n', 'info');
      try {
        log('state 存在: ' + (typeof state === 'object'), 'info');
        log('init 存在: ' + (typeof init === 'function'), 'info');
        await init();
        log('✅ init() 完成', 'success');
      } catch(e) {
        log(`❌ ${e.message}`, 'error');
        if (e.stack) log(e.stack, 'error');
      }
    }

    log('💡 点击"测试全部文件"开始诊断', 'info');
  </script>
</body>
</html>
